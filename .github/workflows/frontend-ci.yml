name: Frontend CI - Build e Testes

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

# Boa prática de segurança: Restringe as permissões do GITHUB_TOKEN apenas para leitura de conteúdo
permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar o Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Instalar dependências
        run: npm ci

      - name: Checagem de Tipos (TypeScript)
        run: npm run typecheck

      - name: Rodar Testes (Vitest)
        env:
          CI: true
        run: npm test

      - name: Fazer o Build
        run: npm run build